# Build the Astro site and publish it to GitHub Pages.
# Runs on every push to main, every hour (to pick up posts published in the
# Fullbleed CMS), and on demand from the Actions tab ("Run workflow").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Fullbleed publishable key (repo Settings → Secrets and variables → Actions).
      FULLBLEED_API_KEY: ${{ secrets.FULLBLEED_API_KEY }}
      # TODO: set to '1' once fullbleed.basilpot.com stops challenging GitHub's servers (see README).
      FULLBLEED_STRICT: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
