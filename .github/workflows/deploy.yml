# Build the Astro site and publish it to GitHub Pages.
# Runs on every push to main, every 5 minutes (to pick up posts published in the
# Fullbleed CMS), and on demand from the Actions tab ("Run workflow").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes, so new Fullbleed posts go live quickly (public repo: Actions minutes are free)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Fullbleed publishable key (repo Settings → Secrets and variables → Actions).
      FULLBLEED_API_KEY: ${{ secrets.FULLBLEED_API_KEY }}
      # '1': if Fullbleed can't be reached, the build fails and the live site keeps its last good version
      # (instead of publishing without the CMS posts).
      FULLBLEED_STRICT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
